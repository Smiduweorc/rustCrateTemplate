# Pinned tooling. `mise install` fetches these as single binaries; no Node,
# no package manager, nothing installed globally. Rust is pinned in
# rust-toolchain.toml instead, which rustup reads on its own.
[tools]
just = "1"
lefthook = "2"
git-cliff = "2"
# Checks commit messages against .commitlintrc.yml; scripts/commit-msg.sh uses
# it when it is on PATH. Its recent releases ship no binaries, so mise builds
# it with cargo, using the toolchain rust-toolchain.toml pins.
"cargo:commitlint-rs" = "0.2"
